# Python backend for the Vercel Services `captions` service (api/youtube_captions.py).
# Vercel Services' Python runtime builds this with uv, which requires a
# [project] table to lock. Runtime deps live here (not requirements.txt) so uv
# is the single source of truth. ruff is a local dev tool, not a runtime dep —
# install it separately (`brew install ruff`); run `npm run lint:py`.

[project]
name = "captions"
version = "0"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2026.7.4",
    "certifi>=2026.7.22",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# A pragmatic baseline. E/F (pycodestyle errors / pyflakes) are the floor;
# I (import sorting) keeps the yt-dlp/stdlib grouping tidy; UP (pyupgrade)
# nudges modern syntax. BLE001 is allowed inline via noqa where a top-level
# ASGI catch-all is intentional (see api/youtube_captions.py).
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# stdlib / third-party separation is enough for a single-module service.
known-first-party = []
